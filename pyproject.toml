[project]
name = "evalkit-cli"
version = "0.0.1"
description = "EvalKit CLI - Agent Evaluation Framework. A tool to bootstrap your projects for comprehensive agent evaluation."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
]

[project.scripts]
evalkit = "evalkit_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit_cli"]
